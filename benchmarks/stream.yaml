# DAMOV2 benchmark descriptor for the instrumented STREAM (workloads/STREAM).
#
# Build the binary first:  cd workloads/STREAM && make GEM5_ROOT=/opt/gem5
# `options` selects the kernel to profile and the array size. The paper uses
# 50,000,000 elements (Table 2); that is ~1.2 GB and slow to simulate, so the
# default here is a simulation-friendly 8,000,000. Raise it on capable nodes.

suite: stream
functions:
  - name: Add
    binary: workloads/STREAM/stream_omp
    options: "add 8000000"
    class: 1a            # STREAM Add -> DRAM bandwidth-bound
  - name: Copy
    binary: workloads/STREAM/stream_omp
    options: "copy 8000000"
    class: 1a
  - name: Scale
    binary: workloads/STREAM/stream_omp
    options: "scale 8000000"
    class: 1a
  - name: Triad
    binary: workloads/STREAM/stream_omp
    options: "triad 8000000"
    class: 1a
