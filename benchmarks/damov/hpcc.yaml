# DAMOV2 descriptor for DAMOV suite 'hpcc', migrated from DAMOV
# command file(s) hpcc_cf (biopim/damov@4d611a5) by
# scripts/migrate_damov.py. {threads} expands to the simulated core count of
# each job (DAMOV's THREADS); {root} to the DAMOV2 repository root.
#
# Binaries must be rebuilt against hooks/compat/zsim_hooks.h (or ported to
# hooks/damov_hooks.h): ZSim-instrumented builds never trigger the gem5 ROI.
# See docs/migrating-from-damov.md.

suite: "hpcc"
functions:
  - name: "RA_update"    # hpcc_cf:1, DAMOV stats hpcc_RA_update
    binary: "{root}/workloads/hpcc/OPENMP/ra_omp_update"
    options: ""
  - name: "RA_ra"    # hpcc_cf:2, DAMOV stats hpcc_RA_ra
    binary: "{root}/workloads/hpcc/OPENMP/ra_omp"
    options: ""
