# DAMOV2 descriptor for DAMOV suite 'hashjoin', migrated from DAMOV
# command file(s) hashjoin_cf (biopim/damov@4d611a5) by
# scripts/migrate_damov.py. {threads} expands to the simulated core count of
# each job (DAMOV's THREADS); {root} to the DAMOV2 repository root.
#
# Binaries must be rebuilt against hooks/compat/zsim_hooks.h (or ported to
# hooks/damov_hooks.h): ZSim-instrumented builds never trigger the gem5 ROI.
# See docs/migrating-from-damov.md.

suite: "hashjoin"
functions:
  - name: "NPO_knuthshuffle"    # hashjoin_cf:1, DAMOV stats hashjoin_NPO_knuthshuffle
    binary: "{root}/workloads/multicore-hashjoins-0.1/src/mchashjoins_knuth_shuffle"
    options: "-a NPO -r 12800000 -s 12000000 -x 12345 -y 54321 -n {threads}"
  - name: "NPO_lock"    # hashjoin_cf:2, DAMOV stats hashjoin_NPO_lock
    binary: "{root}/workloads/multicore-hashjoins-0.1/src/mchashjoins_lock"
