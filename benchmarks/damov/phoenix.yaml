# DAMOV2 descriptor for DAMOV suite 'phoenix', migrated from DAMOV
# command file(s) phoenix_cf (biopim/damov@4d611a5) by
# scripts/migrate_damov.py. {threads} expands to the simulated core count of
# each job (DAMOV's THREADS); {root} to the DAMOV2 repository root.
#
# Binaries must be rebuilt against hooks/compat/zsim_hooks.h (or ported to
# hooks/damov_hooks.h): ZSim-instrumented builds never trigger the gem5 ROI.
# See docs/migrating-from-damov.md.

suite: "phoenix"
functions:
  - name: "Kmeans_kmeans_reduce"    # phoenix_cf:1, DAMOV stats phoenix_Kmeans_kmeans_reduce
    binary: "{root}/workloads/phoenix/phoenix-2.0/tests/kmeans/kmeans-pthread"
    options: "-d 3 -c 1000 -p 1000000 -s 1000 -t {threads}"
  - name: "Linearregression_main"    # phoenix_cf:2, DAMOV stats phoenix_Linearregression_main
    binary: "{root}/workloads/phoenix/phoenix-2.0/tests/linear_regression/linear_regression-pthread"
    options: "{root}/workloads/phoenix/phoenix-2.0/datasets/linear_regression_datafiles/key_file_500MB.txt {threads}"
  - name: "Stringmatch_main"    # phoenix_cf:3, DAMOV stats phoenix_Stringmatch_main
    binary: "{root}/workloads/phoenix/phoenix-2.0/tests/string_match/string_match-pthread"
    options: "{root}/workloads/phoenix/phoenix-2.0/datasets/string_match_datafiles/key_file_500MB.txt {threads}"
  - name: "PCA_main"    # phoenix_cf:4, DAMOV stats phoenix_PCA_main
    binary: "{root}/workloads/phoenix/phoenix-2.0/tests/pca/pca-pthread"
    options: "{threads}"
  - name: "WordCount_main"    # phoenix_cf:5, DAMOV stats phoenix_WordCount_main
    binary: "{root}/workloads/phoenix/phoenix-2.0/tests/word_count/word_count-pthread"
    options: "{root}/workloads/phoenix/phoenix-2.0/datasets/word_count_datafiles/word_100MB.txt 1 {threads}"
