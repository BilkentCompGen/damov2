# DAMOV2 global configuration migrated from DAMOV's
#   generate_config_files.py (biopim/damov@4d611a5)
# for core version 'ooo' (cpu_type O3). Generated by
# scripts/migrate_damov.py; only cores/configs/cpu_type/output_root differ
# from configs/damov.yaml.

# DAMOV2 global configuration. Paths may be absolute or relative to the repo
# root. Consumed by scripts/*.py.

# --- Simulator ------------------------------------------------------------
gem5_binary: external/gem5/build/X86/gem5.opt  # path to your gem5.opt (submodule)
gem5_config: gem5/configs/damov_se.py
# Ramulator2 memory: a preset name (hmc / hbm2 / ddr4) or a path to a Ramulator2
# DSL (.py) / YAML / JSON config. "hmc" => the 3D-stacked HBM2 model (Table 1).
ramulator_config: hmc
ramulator_home: external/ramulator2             # Ramulator2 checkout (submodule)
cpu_type: O3  # migrated from DAMOV

# --- DAMOV2 C++ tools -----------------------------------------------------
tools_dir: build                               # directory holding damov-locality/stats/classify

# --- Experiment sweep (Table 1) ------------------------------------------
output_root: out  # migrated from DAMOV
# Paper Table 1 sweeps {1,4,16,64,256}. The default caps at 64 because a
# 256-core out-of-order gem5 run needs ~60 GB+ of free host RAM and OOMs on
# typical machines. 64 cores already exposes Class 1a DRAM-bandwidth
# saturation; add 256 back for faithful Class 2a (L3 contention) detection on a
# large-memory host or cluster (see docs/methodology.md).
cores: [1, 4, 16, 20, 32, 40, 64, 80, 112, 128, 256]  # migrated from DAMOV
configs: [host_ooo, host_prefetch, ndp]  # migrated from DAMOV
classify_config: host_ooo                      # config whose sweep drives classification

# --- Step 2: locality analysis -------------------------------------------
locality:
  spatial_window: 64
  temporal_window: 64
  granularity: 8         # bytes (word granularity, per the paper)

# --- Step 3: classification thresholds (validated, paper §3.5.1) ----------
thresholds:
  temporal_locality: 0.48
  lfmr: 0.56
  mpki: 11.0
  ai: 8.5
  trend_delta: 0.10
