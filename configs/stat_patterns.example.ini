# Example stat-name pattern overrides for `damov-stats --patterns`.
#
# gem5 stat names drift across versions and cache configurations. Each key maps
# a DAMOV quantity to a comma-separated list of substrings; a raw stat matches
# if its name contains ANY listed substring, and all matching stats are summed
# (except `cycles`, which takes the max across cores). Copy this file, adjust to
# your gem5 build's `stats.txt`, and pass it with `--patterns`.

instructions = simInsts, committedInsts
cycles       = numCycles
l1d_misses   = dcache.overallMisses::total, dcache.demandMisses::total
l1i_misses   = icache.overallMisses::total, icache.demandMisses::total
l1d_accesses = dcache.overallAccesses::total, dcache.demandAccesses::total
llc_misses   = l3.overallMisses::total, llc.overallMisses::total
alu_ops      = committedInstType::IntAlu, statIssuedInstType_0::IntAlu
fp_ops       = committedInstType::FloatAdd, committedInstType::FloatMult
dram_reads   = ramulator2.read_requests, ramulator2.reads
dram_writes  = ramulator2.write_requests, ramulator2.writes
