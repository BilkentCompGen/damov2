# DAMOV2 off-chip DDR4 baseline for Ramulator2.
#
# Represents a conventional off-chip main memory for host-CPU experiments where
# you want a commodity DRAM instead of the 3D-stacked model in HMC-config.yaml.
# Useful for sensitivity studies (Section 3.4) contrasting off-chip vs in-logic
# memory bandwidth/latency.

Frontend:
  impl: SimpleO3
  clock_ratio: 6
  num_expected_insts: 0
  Translation:
    impl: RandomTranslation
    max_addr: 2147483648

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 4

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 4
      rank: 2
      bankgroup: 4
      bank: 4
    timing:
      preset: DDR4_3200AA

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins: []

  AddrMapper:
    impl: RoBaRaCoCh
